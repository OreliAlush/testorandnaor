<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>פרטי בקשה</title>
    <style>
      body {
        background: #182019;
        color: #f5f1e8;
        font-family: Arial;
      }
      .box {
        max-width: 600px;
        margin: 25px auto;
        padding: 25px;
        background: #263129;
        border-radius: 16px;
      }
      textarea,
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin: 6px 0 15px;
      }
      button {
        padding: 13px;
        background: #e9ae50;
        border: 0;
        border-radius: 9px;
      }
      .error {
        color: #ffb1a1;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>בקשה מ־{{ service_request.name }}</h1>
      <p>
        <b>טלפון:</b> {{ service_request.phone }}<br /><b>עיר:</b> {{
        service_request.city }}<br />{{ service_request.description }}
      </p>
      {% if service_request.photo %}
      <p>
        <a href="{{ service_request.photo.url }}" target="_blank"
          >פתיחת תמונה</a
        >
      </p>
      {% endif %}{% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}<label>מחיר כולל בש״ח</label
        ><input type="number" name="price" min="1" required /><label
          >הודעה ללקוח</label
        ><textarea name="message" rows="5"></textarea
        ><button>שמירת הצעת המחיר</button>
      </form>
    </main>
  </body>
</html>
