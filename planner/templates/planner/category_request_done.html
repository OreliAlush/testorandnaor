{% load static %}<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>הבקשה נשלחה | OrProServices</title>
    <link rel="stylesheet" href="{% static 'planner/portal.css' %}" />
  </head>
  <body class="portal">
    <main class="shell" style="max-width: 620px">
      <section class="hero">
        <span class="pill">✓ נשלח בהצלחה</span>
        <h1>קיבלנו את הבקשה שלך.</h1>
        {% if count %}
        <p>
          הבקשה הועברה ל־{{ count }} בעלי מקצוע פעילים בתחום {{ category.name
          }}.
        </p>
        {% else %}
        <p>הבקשה נשמרה במערכת.</p>
        {% endif %}<a class="button" href="/">חזרה לדף הבית</a>
      </section>
    </main>
  </body>
</html>
