<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>תודה | iPergola</title>
    <style>
      body {
        margin: 0;
        background: #182019;
        color: #f5f1e8;
        font-family: Arial, sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
        text-align: center;
      }
      .box {
        max-width: 430px;
        padding: 30px;
      }
      .mark {
        font-size: 64px;
        color: #e9ae50;
      }
      h1 {
        font-size: 32px;
      }
      p {
        line-height: 1.7;
        color: #c5c8bf;
      }
      a {
        display: inline-block;
        margin-top: 15px;
        padding: 14px 22px;
        border-radius: 12px;
        background: #e9ae50;
        color: #1b1a16;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">✓</div>
      <h1>הבקשה נשלחה לבעלי מקצוע</h1>
      <p>
        תודה! בעלי עסקים פעילים יקבלו את פרטי הפרויקט ויוכלו להגיש הצעת מחיר
        אמיתית.
      </p>
      <a href="/">לתכנון נוסף</a>
    </div>
  </body>
</html>
