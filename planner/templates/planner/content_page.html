{% load static %}<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title }} | OrProServices</title>
    <link rel="stylesheet" href="{% static 'planner/portal.css' %}" />
  </head>
  <body class="portal">
    <main class="shell" style="max-width: 820px">
      <header class="topbar">
        <a class="logo" href="/">Or<b>ProServices</b></a
        ><a class="pill" href="/">חזרה</a>
      </header>
      <article class="hero">
        <h1>{{ page.title }}</h1>
        <p>{{ page.summary }}</p>
        {% if page.cover_image %}<img
          src="{{ page.cover_image.url }}"
          alt="{{ page.title }}"
          style="
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            border-radius: 14px;
            margin-top: 16px;
          "
        />{% endif %}
      </article>
      <section class="card" style="white-space: pre-line; line-height: 1.8">
        {{ page.body }}
      </section>
    </main>
  </body>
</html>
