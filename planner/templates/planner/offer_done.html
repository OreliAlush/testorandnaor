<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ההצעה נשלחה</title>
    <style>
      body {
        margin: 0;
        background: #182019;
        color: #f5f1e8;
        font-family: Arial, sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
        text-align: center;
      }
      .box {
        padding: 30px;
      }
      .mark {
        font-size: 55px;
        color: #e9ae50;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">✓</div>
      <h1>הצעת המחיר נשלחה</h1>
      <p>תודה. היא זמינה כעת למנהל המערכת.</p>
    </div>
  </body>
</html>
